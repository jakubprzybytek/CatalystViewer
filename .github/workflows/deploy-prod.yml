name: Deploy Prod

# Manual deploy of the prod stage. Run it from a v* tag (release / rollback) or, during the
# migration (docs/sdlc.md, phase 1), from main.
on:
  workflow_dispatch:
    inputs:
      skip_data_test:
        description: "Skip the 'Data is displayed' smoke test (only for the first deploy, before prod has data)"
        type: boolean
        default: false

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for AWS role
  contents: read

env:
  STAGE: prod
  AWS_DEFAULT_REGION: eu-west-1

jobs:

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    name: Deploy Prod

    steps:
      - name: Check ref
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Prod can only be deployed from main or a v* tag, got ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: bahmutov/npm-install@v1.12.1

      - name: Run unit tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::198805281865:role/GitHub-CatalystViewer
          aws-region: ${{env.AWS_DEFAULT_REGION}}

      - name: Run Serverless Stack deploy
        run: npm run deploy -- --stage ${STAGE}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke:prod -- ${{ inputs.skip_data_test && '--grep-invert "Data is displayed"' || '' }}
        env:
          TEST_USERNAME: ${{ vars.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

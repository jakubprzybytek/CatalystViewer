name: Deploy Prod

# Manual deploy of an existing release tag to prod: rollback, or redeploy after a failed prod job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.2.3)
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    name: Check tag
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag exists and is a release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'$TAG' is not a release tag (vX.Y.Z)"; exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || { echo "Tag $TAG does not exist"; exit 1; }

  prod:
    needs: validate
    uses: ./.github/workflows/deploy-stage.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: prod
      ref: ${{ inputs.tag }}
    secrets: inherit

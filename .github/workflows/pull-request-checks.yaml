# Checks for every pull request (Dependabot's included), per agent-playbook/dependabot.
# No AWS access and no secrets: Dependabot PRs don't get the repo's secrets anyway.
# Delivery is continuous-delivery.yaml on main.

name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Registry signatures
        run: npm audit signatures
      # `typecheck` runs `sst install` first, for the generated sst-env.d.ts
      - run: npm run typecheck
      - run: npm test
      # The site only: the root `build` (sst build) needs AWS access
      - run: npm run build -w web

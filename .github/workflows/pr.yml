name: Pull Request

# Checks only; delivery is cd.yml on main. No AWS access here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

name: Checks

# Unit tests and typecheck. Reused by the PR workflow and the delivery pipeline.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Unit tests and typecheck

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: bahmutov/npm-install@v1.12.1

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

name: Delivery

# Continuous delivery (docs/sdlc.md):
# checks -> deploy int + smoke tests -> tag vX.Y.Z -> deploy prod from the tag + smoke tests.
on:
  push:
    branches: [ main ]
    # Docs-only pushes don't release. A push that also changes anything else runs normally.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Runs queue up instead of overlapping, so int is never shared and prod deploys stay in order.
concurrency:
  group: delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  int:
    needs: checks
    uses: ./.github/workflows/deploy-stage.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: int
    secrets: inherit

  release:
    needs: int
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Tag release
    permissions:
      contents: write   # push the tag
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version and tag
        id: version
        run: |
          # Re-run of a commit that is already released: reuse its tag.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
          if [ -z "$last" ]; then
            last="v0.0.0"
            messages=$(git log --format='%s%n%b')
          else
            messages=$(git log --format='%s%n%b' "$last..HEAD")
          fi

          # Conventional commits: "type!:" or "BREAKING CHANGE" -> major, "feat:" -> minor, else patch.
          if echo "$messages" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE'; then bump=major
          elif echo "$messages" | grep -qE '^feat(\([^)]*\))?:'; then bump=minor
          else bump=patch
          fi

          IFS=. read -r major minor patch <<< "${last#v}"
          case $bump in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"

          echo "Last release $last, $bump bump -> $tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  prod:
    needs: release
    uses: ./.github/workflows/deploy-stage.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: prod
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
